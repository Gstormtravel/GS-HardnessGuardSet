name: GS-HardnessGuardSet
version: 2.0.0
main: br.com.survivalzao.hardnessguard.HardnessGuardPlugin
api-version: '1.21'
softdepend: [KGenerators]
description: Configura dureza e velocidade de quebra de qualquer bloco do Minecraft por tipo de geracao (NATURAL_GEN, KGEN_GEN, LAVA_GENERATOR_GEN, PLAYER_PLACED, ALL).
commands:
  hardnessguard:
    description: Gerencia regras de dureza de blocos e diagnostico do GS-HardnessGuardSet
    aliases: [hguard, gsguard, obsidianguard]
    usage: /hardnessguard <status|check|list|setrule|removerule|setblock|removeblock|reload>
    permission: hardnessguard.admin
permissions:
  hardnessguard.admin:
    description: Permite gerenciar o GS-HardnessGuardSet
    default: op
  hardnessguard.bypass:
    description: Ignora modificadores de dureza quando settings.use-bypass-permission estiver true
    default: false
